name: Release

# Pushing a tag such as v2.2.0 builds the VSIX and attaches it to a GitHub release.
# The tag must match the version in package.json, and CHANGELOG.md needs a
# "## <version> - <date>" section, which becomes the release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Extract release notes from CHANGELOG.md
        run: |
          tr -d '\r' < CHANGELOG.md | awk -v v="$VERSION" '
            $0 ~ "^## " v " - " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Package extension
        run: npm run package -- --githubBranch "$GITHUB_SHA" --out "sftp-xavi-$VERSION.vsix"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "sftp-xavi-$VERSION.vsix" \
            --verify-tag \
            --title "SFTP Xavi $VERSION" \
            --notes-file release-notes.md

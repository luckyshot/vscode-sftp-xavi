name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Package extension
        if: matrix.node == 24
        run: npm run package -- --githubBranch "${{ github.sha }}" --out sftp-xavi.vsix
      - name: Save extension package
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: vs-code-sftp-xavi
          path: sftp-xavi.vsix
